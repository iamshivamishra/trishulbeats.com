name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/trishul-beats-ci
          AUTH_SECRET: ci-auth-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          RAZORPAY_KEY_ID: ci-razorpay-key-id
          RAZORPAY_KEY_SECRET: ci-razorpay-key-secret
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-razorpay-key-id
          STORAGE_PROVIDER: r2
          R2_ACCOUNT_ID: ci-r2-account
          R2_ACCESS_KEY_ID: ci-r2-key-id
          R2_SECRET_ACCESS_KEY: ci-r2-secret
          R2_BUCKET_NAME: ci-r2-bucket
          R2_PUBLIC_URL: https://example-r2.invalid
        run: npm run check
